# SPDX-License-Identifier: Apache-2.0
#
# Dependabot config for GitHub Actions. The workflow files under
# `.github/workflows/` pin every external action by commit SHA with
# the release tag captured as an inline comment (supply-chain
# hygiene — a mutable `@v4` tag can be retagged to a malicious
# commit, a pinned SHA cannot). Dependabot is aware of the
# `<sha> # <version>` idiom and bumps both the SHA and the comment
# in lockstep when a new release lands upstream.
#
# Weekly cadence keeps churn bounded; security-flagged updates
# arrive out of band regardless of the schedule.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      # Collapse routine action bumps into a single PR so reviewers
      # see one diff for a week's worth of pin updates instead of
      # one PR per action. Security-flagged updates ignore the
      # grouping and open their own PRs.
      actions:
        patterns:
          - "*"
