# SPDX-License-Identifier: Apache-2.0
#
# Manual release pipeline. One `workflow_dispatch` invocation runs
# four jobs in strict order:
#
#   1. prepare         Reads `project(... VERSION X.Y.Z)` from
#                      CMakeLists.txt, computes the next version per
#                      the `bump` input, exposes it as an output.
#                      No commit, no tag, no push — strictly read-
#                      only against the repo.
#   2. build-binaries  Matrix across x86_64 + 4 cross-arch targets
#                      under qemu-user. Applies the new version to
#                      its own checkout in-memory (sed on
#                      CMakeLists.txt) so the artifact tarball names
#                      and the in-binary `v8m_version()` reflect the
#                      target version, but does NOT push the change
#                      back. Each arch uploads its tarball + sha256.
#                      Failure here aborts the workflow before any
#                      version commit lands.
#   3. commit-and-tag  Runs only when EVERY matrix lane succeeded.
#                      Re-applies the bump to CMakeLists.txt and
#                      creates an auto-signed commit + annotated tag
#                      via the GitHub GraphQL API. This is the only
#                      job that mutates the published repo.
#   4. release         Generates a reproducible source tarball from
#                      the freshly-pushed tag, downloads every
#                      arch's artifact, and creates the GitHub
#                      release. Release notes are auto-generated by
#                      GitHub via `--generate-notes` against the
#                      categories defined in `.github/release.yml`.
#
# Why the prepare/build/commit split: the previous shape committed
# and tagged BEFORE building, which left the repo at vX.Y.Z + a
# pushed tag even when the binary build later failed (then re-
# triggering the workflow would bump again to vX.Y.(Z+1) on top of
# the broken state). Now: the version only moves on a green build.
#
# All actions are pinned by 40-char commit SHA with the release tag
# in an inline comment (supply-chain hygiene; see
# `.github/dependabot.yml` for the auto-bump cadence).

name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Semver component to bump'
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write   # commit + tag + release
  pull-requests: read   # for `gh release create --generate-notes`

concurrency:
  # Two release runs in flight against the same branch would race
  # on the eventual bump-and-tag commit. Serialize them.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Compute next version
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Read current version
        id: read
        # CMakeLists has tab-indented `\tVERSION X.Y.Z` on its own
        # line under `project(...)`. The regex matches that exact
        # shape so a stray `VERSION` mention elsewhere doesn't get
        # picked up.
        run: |
          cur=$(awk '/^[[:space:]]*VERSION[[:space:]]+[0-9]+\.[0-9]+\.[0-9]+[[:space:]]*$/ {print $2; exit}' CMakeLists.txt)
          if [ -z "$cur" ]; then
            echo "::error::could not extract VERSION from CMakeLists.txt"
            exit 1
          fi
          echo "Current version: $cur"
          echo "current=$cur" >> "$GITHUB_OUTPUT"
      - name: Compute new version
        id: bump
        run: |
          IFS='.' read -r M m p <<< "${{ steps.read.outputs.current }}"
          case "${{ inputs.bump }}" in
            major) M=$((M+1)); m=0; p=0 ;;
            minor) m=$((m+1)); p=0 ;;
            patch) p=$((p+1)) ;;
          esac
          new="$M.$m.$p"
          echo "Next version: $new"
          echo "new_version=$new" >> "$GITHUB_OUTPUT"
      - name: Refuse if tag already exists
        # If a previous failed run pushed the tag (or a maintainer
        # tagged manually), a second run would try to push the same
        # name and fail much later, after the binary builds. Catch
        # it up front so the maintainer can either delete the stale
        # tag or pick a different bump.
        run: |
          ver="${{ steps.bump.outputs.new_version }}"
          if git ls-remote --tags origin "refs/tags/v$ver" | grep -q .; then
            echo "::error::tag v$ver already exists on origin — delete it or pick a different bump"
            exit 1
          fi

  build-binaries:
    name: Build (${{ matrix.arch }})
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            qemu: false
          - arch: aarch64
            qemu: true
          - arch: ppc64le
            qemu: true
          - arch: s390x
            qemu: true
          - arch: riscv64
            qemu: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Apply target version locally
        # In-place version bump on the CHECKOUT only; we do NOT
        # commit, push, or tag here. The point is to produce
        # binaries whose `v8m_version()` reports the target version
        # without yet mutating the published repo. The same sed
        # runs in commit-and-tag below to lock the change in once
        # every arch has built green.
        run: |
          ver="${{ needs.prepare.outputs.new_version }}"
          sed -i -E "s/^([[:space:]]*VERSION[[:space:]]+)[0-9]+\.[0-9]+\.[0-9]+/\1$ver/" CMakeLists.txt
          echo "--- diff ---"
          git --no-pager diff CMakeLists.txt
      - name: Build (native x86_64)
        if: matrix.qemu == false
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
      - name: Build (cross ${{ matrix.arch }} via qemu)
        if: matrix.qemu == true
        uses: uraimo/run-on-arch-action@f9b26e3a1a408d5fd530d20c17b9f3f4428ff8d9 # v3.1.0
        with:
          arch: ${{ matrix.arch }}
          # Must ship GCC >= 13 to satisfy the top-level CMakeLists
          # version gate. Debian `bookworm` ships GCC 12.2 and would
          # fail the configure step with
          # `GCC >= 13 required (got 12.2.0)`; `ubuntu24.04` is the
          # distro the regular multi-arch CI workflow already uses
          # successfully on every non-x86 target.
          distro: ubuntu24.04
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          install: |
            apt-get update -qq
            apt-get install -y --no-install-recommends \
              build-essential cmake
          run: |
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
            cmake --build build --parallel
      - name: Package
        run: |
          ver="${{ needs.prepare.outputs.new_version }}"
          dir="v8malloc-$ver-linux-${{ matrix.arch }}"
          mkdir -p "$dir/lib" "$dir/include"
          # Copy shared library + symlinks (cp -P preserves them).
          cp -P build/libv8malloc.so* "$dir/lib/" 2>/dev/null || true
          # Static archive when present.
          if [ -f build/libv8malloc.a ]; then
            cp build/libv8malloc.a "$dir/lib/"
          fi
          cp -r include/v8malloc "$dir/include/"
          cp LICENSE README.md "$dir/"
          tar -cJf "$dir.tar.xz" "$dir"
          sha256sum "$dir.tar.xz" > "$dir.tar.xz.sha256"
          ls -la *.tar.xz*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-${{ matrix.arch }}
          path: |
            v8malloc-*.tar.xz
            v8malloc-*.tar.xz.sha256
          retention-days: 1

  commit-and-tag:
    name: Commit version bump + tag (signed)
    # Only run when every matrix lane in build-binaries succeeded.
    # `needs:` already enforces the dependency; the implicit job
    # success requirement (no `if: always()`) gates on green.
    needs: [prepare, build-binaries]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with retry on transient HTTP 500)
        # We still need a working copy to apply the version bump
        # and capture the parent HEAD for the GraphQL
        # `createCommitOnBranch` mutation below (which auto-signs
        # with GitHub's web-flow GPG key).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          for i in 1 2 3 4 5; do
            if git clone --no-tags \
                "https://x-access-token:$GH_TOKEN@github.com/$REPO.git" .; then
              break
            fi
            echo "::warning::checkout attempt $i failed, retrying in $((i * 5))s"
            rm -rf ./* ./.git 2>/dev/null || true
            sleep $((i * 5))
            if [ "$i" -eq 5 ]; then
              echo "::error::checkout failed after 5 attempts"
              exit 1
            fi
          done
      - name: Update CMakeLists.txt (locally)
        run: |
          ver="${{ needs.prepare.outputs.new_version }}"
          sed -i -E "s/^([[:space:]]*VERSION[[:space:]]+)[0-9]+\.[0-9]+\.[0-9]+/\1$ver/" CMakeLists.txt
          git --no-pager diff CMakeLists.txt
      - name: Create signed commit via GraphQL
        # GitHub's `createCommitOnBranch` GraphQL mutation creates
        # the commit on the remote in a single API call AND signs it
        # with the GitHub web-flow GPG key — the resulting commit
        # shows as **Verified** on the web UI without us having to
        # manage a private GPG key in repo secrets. Docs:
        # https://docs.github.com/en/graphql/reference/mutations#createcommitonbranch
        #
        # `expectedHeadOid` bails the call (with a clear error) if
        # main moved between checkout and commit, so a concurrent
        # push can't be silently overwritten.
        id: commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ needs.prepare.outputs.new_version }}
          REPO: ${{ github.repository }}
        run: |
          # Capture parent HEAD as our expected oid (concurrency check).
          expected=$(git rev-parse HEAD)
          # base64 -w0: no line wrapping, single-blob output that
          # JSON requires.
          cmake_b64=$(base64 -w0 CMakeLists.txt)
          # Build the mutation payload via python so binary content
          # never traverses the shell's argv (avoids any ARG_MAX
          # trap should the file grow).
          python3 - "$expected" "$cmake_b64" > payload.json <<'PY'
          import json, os, sys
          expected, cmake_b64 = sys.argv[1:]
          payload = {
              "query": (
                  "mutation($input: CreateCommitOnBranchInput!) {"
                  "  createCommitOnBranch(input: $input) {"
                  "    commit { oid url }"
                  "  }"
                  "}"
              ),
              "variables": {
                  "input": {
                      "branch": {
                          "repositoryNameWithOwner": os.environ["REPO"],
                          "branchName": "main",
                      },
                      "expectedHeadOid": expected,
                      "message": {
                          "headline": f"chore: Release v{os.environ['NEW_VERSION']}",
                      },
                      "fileChanges": {
                          "additions": [
                              {"path": "CMakeLists.txt", "contents": cmake_b64},
                          ],
                      },
                  },
              },
          }
          json.dump(payload, sys.stdout)
          PY
          oid=$(gh api graphql --input payload.json \
                  --jq '.data.createCommitOnBranch.commit.oid')
          if [ -z "$oid" ] || [ "$oid" = "null" ]; then
            echo "::error::createCommitOnBranch returned no oid"
            gh api graphql --input payload.json
            exit 1
          fi
          echo "Signed commit: $oid"
          echo "oid=$oid" >> "$GITHUB_OUTPUT"
      - name: Create annotated tag pointing at signed commit
        # Two-step REST API tag creation: first the tag object
        # (annotated tag with message), then the tag ref pointing
        # at it. The tag itself is unsigned (GitHub's web-flow
        # signing only applies to commits, not tag objects); the
        # underlying commit it points to is the signed one. For a
        # fully-signed tag, switch to a GPG-key-based flow.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ needs.prepare.outputs.new_version }}
          REPO: ${{ github.repository }}
          COMMIT_OID: ${{ steps.commit.outputs.oid }}
        run: |
          tag_oid=$(gh api -X POST "repos/$REPO/git/tags" \
            -f tag="v$NEW_VERSION" \
            -f message="Release v$NEW_VERSION" \
            -f object="$COMMIT_OID" \
            -f type=commit \
            --jq '.sha')
          gh api -X POST "repos/$REPO/git/refs" \
            -f ref="refs/tags/v$NEW_VERSION" \
            -f sha="$tag_oid"
          echo "Tag v$NEW_VERSION → commit $COMMIT_OID"

  release:
    name: Publish GitHub Release
    needs: [prepare, commit-and-tag]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag (with retry on transient HTTP 500)
        # Same retry rationale as commit-and-tag — by this point
        # every binary built green AND the tag was pushed; a
        # transient checkout failure here would leave the release
        # un-published despite the rest of the pipeline succeeding.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REF: v${{ needs.prepare.outputs.new_version }}
        run: |
          for i in 1 2 3 4 5; do
            if git clone --no-checkout \
                "https://x-access-token:$GH_TOKEN@github.com/$REPO.git" .; then
              git checkout "$REF" && break
            fi
            echo "::warning::checkout attempt $i failed, retrying in $((i * 5))s"
            rm -rf ./* ./.git 2>/dev/null || true
            sleep $((i * 5))
            if [ "$i" -eq 5 ]; then
              echo "::error::checkout failed after 5 attempts"
              exit 1
            fi
          done
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      - name: Build source tarball
        # Reproducible, gz-compressed source archive (matches the
        # auto-generated GitHub `Source code` archive but with our
        # preferred prefix + a sha256 sidecar).
        run: |
          ver="${{ needs.prepare.outputs.new_version }}"
          git archive --format=tar.gz \
              --prefix="v8malloc-$ver/" \
              -o "artifacts/v8malloc-$ver-src.tar.gz" \
              "v$ver"
          (cd artifacts && sha256sum "v8malloc-$ver-src.tar.gz" \
              > "v8malloc-$ver-src.tar.gz.sha256")
          ls -la artifacts/
      - name: Create release with auto-generated notes
        # `--generate-notes` calls GitHub's
        # `POST /repos/.../releases/generate-notes` API under the
        # hood: it walks the PRs merged between the previous tag
        # and the new one, groups them by the labels declared in
        # `.github/release.yml`, and renders the result as the
        # release body. No CHANGELOG.md, no manual notes file, no
        # 125 KiB body-size manual cap — GitHub enforces its own
        # truncation and includes a "Full Changelog" link footer.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ver="${{ needs.prepare.outputs.new_version }}"
          gh release create "v$ver" \
            --title "v$ver" \
            --generate-notes \
            artifacts/v8malloc-$ver-linux-*.tar.xz \
            artifacts/v8malloc-$ver-linux-*.tar.xz.sha256 \
            "artifacts/v8malloc-$ver-src.tar.gz" \
            "artifacts/v8malloc-$ver-src.tar.gz.sha256"
