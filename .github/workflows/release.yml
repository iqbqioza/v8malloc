# SPDX-License-Identifier: Apache-2.0
#
# Manual release pipeline. One `workflow_dispatch` invocation runs
# four jobs in strict order:
#
#   1. prepare         Reads `project(... VERSION X.Y.Z)` from
#                      CMakeLists.txt, computes the next version per
#                      the `bump` input, exposes it as an output.
#                      No commit, no tag, no push — strictly read-
#                      only against the repo.
#   2. build-binaries  Matrix across x86_64 + 4 cross-arch targets
#                      under qemu-user. Applies the new version to
#                      its own checkout in-memory (sed on
#                      CMakeLists.txt) so the artifact tarball names
#                      and the in-binary `v8m_version()` reflect the
#                      target version, but does NOT push the change
#                      back. Each arch uploads its tarball + sha256.
#                      Failure here aborts the workflow before any
#                      version commit lands.
#   3. commit-and-tag  Runs only when EVERY matrix lane succeeded.
#                      Re-applies the bump to CMakeLists.txt,
#                      promotes `## [Unreleased]` → `## [vX.Y.Z] -
#                      DATE` in CHANGELOG.md, extracts the new
#                      section's body, commits, annotated-tags,
#                      pushes both. This is the only job that
#                      mutates the published repo.
#   4. release         Generates a reproducible source tarball from
#                      the freshly-pushed tag, downloads every
#                      arch's artifact, and creates the GitHub
#                      release with the CHANGELOG section + an
#                      auto-generated PR list as the body.
#
# Why the prepare/build/commit split: the previous shape committed
# and tagged BEFORE building, which left the repo at vX.Y.Z + a
# pushed tag even when the binary build later failed (then re-
# triggering the workflow would bump again to vX.Y.(Z+1) on top of
# the broken state). Now: the version only moves on a green build.
#
# All actions are pinned by 40-char commit SHA with the release tag
# in an inline comment (supply-chain hygiene; see
# `.github/dependabot.yml` for the auto-bump cadence).

name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Semver component to bump'
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write   # commit + tag + release
  pull-requests: read   # for `gh release create --generate-notes`

concurrency:
  # Two release runs in flight against the same branch would race
  # on the eventual bump-and-tag commit. Serialize them.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Compute next version
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Read current version
        id: read
        # CMakeLists has tab-indented `\tVERSION X.Y.Z` on its own
        # line under `project(...)`. The regex matches that exact
        # shape so a stray `VERSION` mention elsewhere doesn't get
        # picked up.
        run: |
          cur=$(awk '/^[[:space:]]*VERSION[[:space:]]+[0-9]+\.[0-9]+\.[0-9]+[[:space:]]*$/ {print $2; exit}' CMakeLists.txt)
          if [ -z "$cur" ]; then
            echo "::error::could not extract VERSION from CMakeLists.txt"
            exit 1
          fi
          echo "Current version: $cur"
          echo "current=$cur" >> "$GITHUB_OUTPUT"
      - name: Compute new version
        id: bump
        run: |
          IFS='.' read -r M m p <<< "${{ steps.read.outputs.current }}"
          case "${{ inputs.bump }}" in
            major) M=$((M+1)); m=0; p=0 ;;
            minor) m=$((m+1)); p=0 ;;
            patch) p=$((p+1)) ;;
          esac
          new="$M.$m.$p"
          echo "Next version: $new"
          echo "new_version=$new" >> "$GITHUB_OUTPUT"
      - name: Refuse if tag already exists
        # If a previous failed run pushed the tag (or a maintainer
        # tagged manually), a second run would try to push the same
        # name and fail much later, after the binary builds. Catch
        # it up front so the maintainer can either delete the stale
        # tag or pick a different bump.
        run: |
          ver="${{ steps.bump.outputs.new_version }}"
          if git ls-remote --tags origin "refs/tags/v$ver" | grep -q .; then
            echo "::error::tag v$ver already exists on origin — delete it or pick a different bump"
            exit 1
          fi

  build-binaries:
    name: Build (${{ matrix.arch }})
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            qemu: false
          - arch: aarch64
            qemu: true
          - arch: ppc64le
            qemu: true
          - arch: s390x
            qemu: true
          - arch: riscv64
            qemu: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Apply target version locally
        # In-place version bump on the CHECKOUT only; we do NOT
        # commit, push, or tag here. The point is to produce
        # binaries whose `v8m_version()` reports the target version
        # without yet mutating the published repo. The same sed
        # runs in commit-and-tag below to lock the change in once
        # every arch has built green.
        run: |
          ver="${{ needs.prepare.outputs.new_version }}"
          sed -i -E "s/^([[:space:]]*VERSION[[:space:]]+)[0-9]+\.[0-9]+\.[0-9]+/\1$ver/" CMakeLists.txt
          echo "--- diff ---"
          git --no-pager diff CMakeLists.txt
      - name: Build (native x86_64)
        if: matrix.qemu == false
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
      - name: Build (cross ${{ matrix.arch }} via qemu)
        if: matrix.qemu == true
        uses: uraimo/run-on-arch-action@d94c13912ea685de38fccc1109385b83fd79427d # v3.0.1
        with:
          arch: ${{ matrix.arch }}
          # Must ship GCC >= 13 to satisfy the top-level CMakeLists
          # version gate. Debian `bookworm` ships GCC 12.2 and would
          # fail the configure step with
          # `GCC >= 13 required (got 12.2.0)`; `ubuntu24.04` is the
          # distro the regular multi-arch CI workflow already uses
          # successfully on every non-x86 target.
          distro: ubuntu24.04
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          install: |
            apt-get update -qq
            apt-get install -y --no-install-recommends \
              build-essential cmake
          run: |
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
            cmake --build build --parallel
      - name: Package
        run: |
          ver="${{ needs.prepare.outputs.new_version }}"
          dir="v8malloc-$ver-linux-${{ matrix.arch }}"
          mkdir -p "$dir/lib" "$dir/include"
          # Copy shared library + symlinks (cp -P preserves them).
          cp -P build/libv8malloc.so* "$dir/lib/" 2>/dev/null || true
          # Static archive when present.
          if [ -f build/libv8malloc.a ]; then
            cp build/libv8malloc.a "$dir/lib/"
          fi
          cp -r include/v8malloc "$dir/include/"
          cp LICENSE README.md CHANGELOG.md "$dir/"
          tar -cJf "$dir.tar.xz" "$dir"
          sha256sum "$dir.tar.xz" > "$dir.tar.xz.sha256"
          ls -la *.tar.xz*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-${{ matrix.arch }}
          path: |
            v8malloc-*.tar.xz
            v8malloc-*.tar.xz.sha256
          retention-days: 1

  commit-and-tag:
    name: Commit version bump + tag
    # Only run when every matrix lane in build-binaries succeeded.
    # `needs:` already enforces the dependency; the implicit job
    # success requirement (no `if: always()`) gates on green.
    needs: [prepare, build-binaries]
    runs-on: ubuntu-latest
    outputs:
      release_notes: ${{ steps.notes.outputs.notes }}
    steps:
      - name: Checkout (with retry on transient HTTP 500)
        # actions/checkout's internal retry only spans ~3 attempts
        # over ~30 s; GitHub's git host occasionally returns HTTP
        # 500 for longer than that, which would normally abort the
        # workflow AFTER every binary built green — exactly the
        # cycle this workflow is structured to avoid. Manual git
        # clone with shell-level backoff (5 attempts, 5/10/15/20 s
        # spacing) absorbs flares the action can't. Token comes
        # from the workflow's `permissions: contents: write` grant.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          for i in 1 2 3 4 5; do
            if git clone --no-tags \
                "https://x-access-token:$GH_TOKEN@github.com/$REPO.git" .; then
              break
            fi
            echo "::warning::checkout attempt $i failed, retrying in $((i * 5))s"
            rm -rf ./* ./.git 2>/dev/null || true
            sleep $((i * 5))
            if [ "$i" -eq 5 ]; then
              echo "::error::checkout failed after 5 attempts"
              exit 1
            fi
          done
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
      - name: Update CMakeLists.txt
        run: |
          ver="${{ needs.prepare.outputs.new_version }}"
          sed -i -E "s/^([[:space:]]*VERSION[[:space:]]+)[0-9]+\.[0-9]+\.[0-9]+/\1$ver/" CMakeLists.txt
          git --no-pager diff CMakeLists.txt
      - name: Promote Unreleased section in CHANGELOG.md
        # Convert `## [Unreleased]` → `## [Unreleased]\n\n## [X.Y.Z]
        # - YYYY-MM-DD`. The empty Unreleased block stays open so
        # the next cycle's notes accumulate under it. Python (vs
        # sed) so the literal `\n` newline pair lands in the file
        # without GNU-vs-BSD escape gymnastics.
        env:
          NEW_VERSION: ${{ needs.prepare.outputs.new_version }}
        run: |
          export TODAY=$(date -u +%Y-%m-%d)
          python3 - <<'PY'
          import os, re, pathlib
          ver = os.environ['NEW_VERSION']
          today = os.environ['TODAY']
          path = pathlib.Path('CHANGELOG.md')
          text = path.read_text()
          replacement = f"## [Unreleased]\n\n## [{ver}] - {today}"
          updated, n = re.subn(r'^## \[Unreleased\]', replacement, text,
                               count=1, flags=re.MULTILINE)
          if n == 0:
              raise SystemExit("CHANGELOG.md: '## [Unreleased]' heading not found")
          path.write_text(updated)
          PY
      - name: Extract release notes
        id: notes
        # Pull the just-promoted version's section out of CHANGELOG
        # so the GitHub release body shows the human-curated notes
        # the maintainer wrote during the cycle.
        run: |
          ver="${{ needs.prepare.outputs.new_version }}"
          awk -v ver="$ver" '
            BEGIN { in_sec = 0 }
            /^## \[/ {
              if ($0 ~ "\\[" ver "\\]") { in_sec = 1; print; next }
              else if (in_sec) { exit }
            }
            in_sec { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "::warning::release notes section [$ver] is empty"
          fi
          {
            echo 'notes<<RELEASE_NOTES_EOF'
            cat release_notes.md
            echo RELEASE_NOTES_EOF
          } >> "$GITHUB_OUTPUT"
      - name: Commit + tag + push
        # `git config user.{name,email}` already set by the
        # checkout-with-retry step. Push runs over the same
        # token-embedded origin URL the clone used, so no
        # additional credential setup is needed.
        run: |
          ver="${{ needs.prepare.outputs.new_version }}"
          git add CMakeLists.txt CHANGELOG.md
          git commit -m "chore: Release v$ver"
          git tag -a "v$ver" -m "Release v$ver"
          git push origin HEAD --follow-tags

  release:
    name: Publish GitHub Release
    needs: [prepare, commit-and-tag]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag (with retry on transient HTTP 500)
        # Same retry rationale as commit-and-tag — by this point
        # every binary built green AND the tag was pushed; a
        # transient checkout failure here would leave the release
        # un-published despite the rest of the pipeline succeeding.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REF: v${{ needs.prepare.outputs.new_version }}
        run: |
          for i in 1 2 3 4 5; do
            if git clone --no-checkout \
                "https://x-access-token:$GH_TOKEN@github.com/$REPO.git" .; then
              git checkout "$REF" && break
            fi
            echo "::warning::checkout attempt $i failed, retrying in $((i * 5))s"
            rm -rf ./* ./.git 2>/dev/null || true
            sleep $((i * 5))
            if [ "$i" -eq 5 ]; then
              echo "::error::checkout failed after 5 attempts"
              exit 1
            fi
          done
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      - name: Build source tarball
        # Reproducible, gz-compressed source archive (matches the
        # auto-generated GitHub `Source code` archive but with our
        # preferred prefix + a sha256 sidecar).
        run: |
          ver="${{ needs.prepare.outputs.new_version }}"
          git archive --format=tar.gz \
              --prefix="v8malloc-$ver/" \
              -o "artifacts/v8malloc-$ver-src.tar.gz" \
              "v$ver"
          (cd artifacts && sha256sum "v8malloc-$ver-src.tar.gz" \
              > "v8malloc-$ver-src.tar.gz.sha256")
          ls -la artifacts/
      - name: Compose release body
        # CHANGELOG section first (human-curated narrative), then a
        # divider, then the auto-generated PR list which `gh
        # release create --notes-file ... --generate-notes` would
        # normally REPLACE the file with — we render it ourselves
        # via the API so both halves coexist.
        env:
          NOTES: ${{ needs.commit-and-tag.outputs.release_notes }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ver="${{ needs.prepare.outputs.new_version }}"
          # Find the previous release tag for the auto-changelog
          # base (skip the just-pushed one).
          prev=$(git tag --sort=-v:refname | grep '^v[0-9]' | grep -v "^v$ver$" | head -1)
          {
            echo "$NOTES"
            echo
            echo '---'
            echo
            echo '## What changed since the previous release'
            echo
          } > body.md
          if [ -n "$prev" ]; then
            gh api -X POST \
              -H 'Accept: application/vnd.github+json' \
              "repos/${{ github.repository }}/releases/generate-notes" \
              -f tag_name="v$ver" \
              -f previous_tag_name="$prev" \
              --jq .body >> body.md
          else
            echo '_First release — no prior tag for diff._' >> body.md
          fi
          echo '--- body.md ---'
          cat body.md
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ver="${{ needs.prepare.outputs.new_version }}"
          gh release create "v$ver" \
            --title "v$ver" \
            --notes-file body.md \
            artifacts/v8malloc-$ver-linux-*.tar.xz \
            artifacts/v8malloc-$ver-linux-*.tar.xz.sha256 \
            "artifacts/v8malloc-$ver-src.tar.gz" \
            "artifacts/v8malloc-$ver-src.tar.gz.sha256"
